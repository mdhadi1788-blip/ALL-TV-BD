<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All TV BD</title>
  
  <meta name="google-site-verification" content="wP1R0tt0hY1BWwipQelzLmbUa85X2me8GWbgl66-c9o" />
  <meta name="description" content="All TV BD - এর মাধ্যমে বাংলাদেশের সব টিভি চ্যানেল লাইভ দেখুন সম্পূর্ণ ফ্রিতে এক জায়গায়।" />

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+Bengali:wght@300;400;600&display=swap" rel="stylesheet"/>
  
  <style>
    :root {
      --bg: #050810;
      --surface: #0d1220;
      --surface2: #141928;
      --accent: #00d4ff;
      --accent2: #ff6b35;
      --text: #e8eef8;
      --muted: #5a6a8a;
      --glow: 0 0 20px rgba(0,212,255,0.4);
      --glow2: 0 0 30px rgba(0,212,255,0.2);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans Bengali', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* animated background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 20% 10%, rgba(0,212,255,0.06) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(255,107,53,0.05) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px
      );
      pointer-events: none;
      z-index: 0;
    }

    /* ===== HEADER ===== */
    header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 32px;
      background: rgba(13,18,32,0.9);
      border-bottom: 1px solid rgba(0,212,255,0.15);
      backdrop-filter: blur(12px);
    }

    .logo { display: flex; align-items: center; gap: 12px; }
    .logo-icon {
      width: 42px; height: 42px;
      background: linear-gradient(135deg, var(--accent), #0066ff);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; box-shadow: var(--glow);
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 20px rgba(0,212,255,0.4); }
      50% { box-shadow: 0 0 35px rgba(0,212,255,0.7); }
    }

    .logo-text {
      font-family: 'Orbitron', monospace; font-weight: 900; font-size: 1.4rem;
      letter-spacing: 2px;
      background: linear-gradient(90deg, var(--accent), #ffffff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .logo-sub {
      font-size: 0.65rem; color: var(--muted); letter-spacing: 3px;
      text-transform: uppercase; font-family: 'Orbitron', monospace;
    }

    .live-badge {
      display: flex; align-items: center; gap: 6px;
      background: rgba(255,50,50,0.15); border: 1px solid rgba(255,50,50,0.4);
      border-radius: 20px; padding: 6px 14px; font-size: 0.75rem;
      font-family: 'Orbitron', monospace; color: #ff4444; letter-spacing: 2px;
    }
    .live-dot { width: 7px; height: 7px; background: #ff4444; border-radius: 50%; animation: blink 1s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    /* ===== MAIN CONTENT CONTAINER ===== */
    .content-container {
      position: relative;
      z-index: 5;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* ===== AD WALL CONTAINER ===== */
    .ad-box {
      background: var(--surface);
      border: 1px solid rgba(0, 212, 255, 0.3);
      box-shadow: var(--glow2);
      border-radius: 16px;
      padding: 35px;
      text-align: center;
      max-width: 450px;
      width: 100%;
    }

    .ad-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 12px;
    }

    .ad-desc {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .ad-btn-link {
      display: block;
      background: linear-gradient(90deg, var(--accent2), #ff4500);
      color: #fff;
      text-decoration: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: 600;
      box-shadow: 0 0 15px rgba(255, 107, 53, 0.3);
      transition: all 0.3s;
      margin-bottom: 16px;
    }

    .ad-btn-link:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }

    .skip-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.05);
      background: rgba(255, 255, 255, 0.02);
      color: var(--muted);
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      cursor: not-allowed;
      font-weight: 600;
      transition: all 0.2s;
    }

    .skip-btn.ready {
      border-color: var(--accent);
      color: #fff;
      background: linear-gradient(90deg, var(--accent), #0066ff);
      cursor: pointer;
      box-shadow: var(--glow);
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">📺</div>
    <div>
      <div class="logo-text">All TV BD</div>
      <div class="logo-sub">Free Live Television</div>
    </div>
  </div>
  <div class="header-actions">
    <div class="live-badge"><div class="live-dot"></div>LIVE</div>
  </div>
</header>

<div class="content-container">
  <div class="ad-box">
    <div class="ad-title">📺 All TV BD-তে স্বাগতম</div>
    <div class="ad-desc" style="color: #ffaa66; font-weight: 600;">সাইটে প্রবেশ করতে অবশ্যই নিচের বাটনে ক্লিক করে আমাদের সাপোর্ট করুন।</div>
    <div class="ad-desc" style="font-size: 0.85rem;">[ লিঙ্কে ক্লিক করার সাথে সাথেই নিচের ধূসর বাটনটি উজ্জ্বল হয়ে আনলক হয়ে যাবে ]</div>
    
    <a href="https://www.effectivecpmnetwork.com/hm3rumzk7p?key=b4fdde0c5b61784f8d71fafaeb76a179" 
       target="_blank" 
       rel="noopener noreferrer" 
       class="ad-btn-link" 
       onclick="enableSkipButton()">
       📢 এখানে ক্লিক করে সাপোর্ট করুন (বাধ্যতামূলক)
    </a>
    
    <button id="skipAdBtn" class="skip-btn" onclick="redirectToTarget()">আগে লিঙ্কে ক্লিক করুন...</button>
  </div>
</div>

<script>
let adClicked = false; 
const TARGET_URL = 'https://www.atvsports.live/';

function enableSkipButton() {
  adClicked = true;
  const skipBtn = document.getElementById('skipAdBtn');
  skipBtn.textContent = 'সাইটে প্রবেশ করুন ➔';
  skipBtn.classList.add('ready');
  skipBtn.style.cursor = 'pointer';
}

function redirectToTarget() {
  if (adClicked) {
    window.location.href = TARGET_URL;
  } else {
    alert('দয়া করে আগে স্পনসর লিঙ্কে ক্লিক করে আমাদের সাপোর্ট করুন!');
  }
}
</script>

</body>
</html>

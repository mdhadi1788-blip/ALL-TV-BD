      z-index: 0;
    }

      inset: 0;
      background: repeating-linear-gradient(

        transparent,
        transparent 2px,

      width: 50px; height: 50px;
      border: 3px solid rgba(0,212,255,0.2);
      border-top-color: var(--accent);

    .error-msg {

      font-size: 0.85rem;
      text-align: center;
      padding: 0 20px;
      font-family: 'Orbitron', monospace;

    /* Now Playing Bar */
    .now-playing {
      background: var(--surface);
      border-top: 1px solid rgba(0,212,255,0.1);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 16px;

    .now-label {
      font-family: 'Orbitron', monospace;
      font-size: 0.6rem;
      color: var(--accent);
      letter-spacing: 2px;
      white-space: nowrap;

    .now-channel {
      font-size: 0.9rem;
      font-weight: 600;
      flex: 1;
    }

    .now-channel-placeholder {
      font-size: 0.85rem;
      color: var(--muted);
      flex: 1;
    }

    /* ===== LOADING STATE ===== */
    .loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 16px;
    }

    .loader-bar {
      width: 200px;
      height: 3px;
      background: rgba(0,212,255,0.1);
      border-radius: 2px;
      overflow: hidden;
    }

    .loader-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #0066ff);
      border-radius: 2px;
      animation: loadfill 2s ease-in-out infinite;
    }

    @keyframes loadfill {
      0% { width: 0%; margin-left: 0; }
      50% { width: 60%; margin-left: 20%; }
      100% { width: 0%; margin-left: 100%; }
    }

    .loader-text {
      font-family: 'Orbitron', monospace;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 2px;
    }

    /* ===== RESPONSIVE TV ===== */
    @media (max-width: 768px) {
      .main {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
        height: auto;
        min-height: calc(100vh - 115px);
      }
      .video-wrap { height: 56vw; min-height: 200px; }
      .sidebar { height: 50vh; }
      header { padding: 12px 16px; }
      .logo-text { font-size: 1.1rem; }
      .sidebar-ad-container { max-height: 100px; padding: 5px; }
    }

    /* TV focus styles */
    .channel-item:focus {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }

    /* Entrance animations */
    .channel-item {
      animation: fadeSlide 0.3s ease both;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: translateX(0); }
    }
  </style>
</head>

// Parse M3U
async function loadM3U() {
  try {
    const [res1, res2, res3] = await Promise.all([
      fetch(M3U_URL_1).then(r => r.text()).catch(() => ''),
      fetch(M3U_URL_2).then(r => r.text()).catch(() => ''),
      fetch(M3U_URL_3).then(r => r.text()).catch(() => '')
    ]);

    const channels1 = parseM3U(res1, 'link1');
    const channels2 = parseM3U(res2, 'akash');
    const channels3 = parseM3U(res3, 'torongo');

    channels = [...channels1, ...channels2, ...channels3];
    applyFilter();
  } catch(e) {
    document.getElementById('channelCount').textContent = 'চ্যানেল লোড করতে সমস্যা হয়েছে';
    document.getElementById('channelList').innerHTML = `
      <div class="loading-state" style="height:200px;color:#ff6b6b;font-size:.8rem;text-align:center;padding:20px">
        ⚠ প্লেলিস্ট লোড করা যাচ্ছে না।<br>ইন্টারনেট চেক করুন।
      </div>`;
  }
}

function parseM3U(text, source) {
  if (!text) return [];
  const lines = text.split('\n');
  const result = [];
  let current = null;

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (line.startsWith('#EXTINF:')) {
      current = { name: '', logo: '', group: '', url: '', sourceTab: '' };
      const commaIdx = line.lastIndexOf(',');
      if (commaIdx !== -1) current.name = line.slice(commaIdx + 1).trim();
      const logoMatch = line.match(/tvg-logo="([^"]*)"/);
      if (logoMatch) current.logo = logoMatch[1];
      const groupMatch = line.match(/group-title="([^"]*)"/);
      if (groupMatch) current.group = groupMatch[1];
      
      const nm = current.name.toLowerCase();
      const grp = current.group.toLowerCase();

      // সোর্স এবং ট্যাব ফিল্টারিং লজিক
      if (source === 'akash') {
        current.sourceTab = 'akash';
      } else if (source === 'torongo') {
        current.sourceTab = 'torongo';
      } else if (source === 'link1') {
        // প্রথম প্লেলিস্টে SM এবং Ayna OTT বাদে বাকি চ্যানেল রিজেক্ট করার কন্ডিশন
        if (grp.includes('ayna') || nm.includes('ayna')) {
          current.sourceTab = 'ayna';
        } else if (grp.includes('sm') || nm.includes('sm') || grp.includes('live tv') || grp.includes('bangla')) {
          // এটি প্রথম মেইন প্লেলিস্টের মূল ক্যাটাগরি হিসেবে কাজ করবে
          current.sourceTab = 'sm';
        } else {
          // SM অথবা Ayna এর বাইরে কিছু হলে তা বাদ যাবে
          current = null;
          continue;
        }
      }
    } else if (line && !line.startsWith('#') && current) {
      current.url = line;
      if (current.name) result.push(current);
      current = null;
    }
  }
  return result;
}

// Tab switcher
function switchTab(tabName) {
  currentTab = tabName;
  
  const buttons = document.querySelectorAll('.tab-btn');
  buttons.forEach(btn => btn.classList.remove('active'));
  
  if (event && event.target) {
    event.target.classList.add('active');
  }
  
  applyFilter();
}

function applyFilter() {
  const searchQ = document.getElementById('searchInput').value.trim().toLowerCase();
  
  filteredChannels = channels.filter(ch => {
    // ট্যাব ফিল্টার লজিক
    let matchesTab = false;
    if (currentTab === 'all') {
      matchesTab = true;
    } else {
      matchesTab = (ch.sourceTab === currentTab);
    }
    
    // সার্চ ফিল্টার
    const matchesSearch = !searchQ || ch.name.toLowerCase().includes(searchQ) || ch.group.toLowerCase().includes(searchQ);
    
    return matchesTab && matchesSearch;
  });
  
  renderChannels();
  document.getElementById('channelCount').textContent = `${filteredChannels.length} টি চ্যানেল পাওয়া গেছে`;
}

function renderChannels() {
  const list = document.getElementById('channelList');
  if (!filteredChannels.length) {
    list.innerHTML = `<div style="padding:20px;text-align:center;color:var(--muted);font-size:.85rem">কোনো চ্যানেল পাওয়া যায়নি</div>`;
    return;
  }

  list.innerHTML = filteredChannels.map((ch, i) => `
    <div class="channel-item ${channels.indexOf(ch) === currentIndex ? 'active' : ''}"
         onclick="playChannel(${channels.indexOf(ch)})"
         tabindex="0"
         style="animation-delay:${Math.min(i * 0.02, 0.5)}s">
      <div class="channel-logo">
        ${ch.logo
          ? `<img src="${ch.logo}" onerror="this.parentElement.innerHTML='📺'" loading="lazy" />`
          : '📺'}
      </div>
      <div class="channel-info">
        <div class="channel-name">${escapeHtml(ch.name)}</div>
        ${ch.group ? `<div class="channel-group">${escapeHtml(ch.group)}</div>` : ''}
      </div>
      <div class="channel-num">${channels.indexOf(ch) + 1}</div>
    </div>
  `).join('');
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function playChannel(index) {
  currentIndex = index;
  const ch = channels[index];
  if (!ch) return;

  document.getElementById('playerOverlay').style.display = 'none';
  document.getElementById('errorMsg').style.display = 'none';
  document.getElementById('loadingRing').style.display = 'block';
  document.getElementById('nowPlaying').textContent = ch.name;

  document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
  
  const allItems = document.querySelectorAll('.channel-item');
  filteredChannels.forEach((fch, fi) => {
    if (channels.indexOf(fch) === index) {
      if (allItems[fi]) {
        allItems[fi].classList.add('active');
        allItems[fi].scrollIntoView({ block: 'nearest' });
      }
    }
  });

  if (hls) { hls.destroy(); hls = null; }
  const video = document.getElementById('videoPlayer');
  const url = ch.url;

  if (url.includes('.m3u8') || url.includes('m3u8')) {
    if (Hls.isSupported()) {
      hls = new Hls({ enableWorker: false });
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        document.getElementById('loadingRing').style.display = 'none';
        video.play().catch(() => {});
      });
      hls.on(Hls.Events.ERROR, (e, data) => {
        if (data.fatal) {
          document.getElementById('loadingRing').style.display = 'none';
          document.getElementById('errorMsg').style.display = 'block';
        }
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = url;
      video.addEventListener('loadedmetadata', () => {
        document.getElementById('loadingRing').style.display = 'none';
        video.play().catch(() => {});
      });
    }
  } else {
    video.src = url;
    video.oncanplay = () => {
      document.getElementById('loadingRing').style.display = 'none';
      video.play().catch(() => {});
    };
    video.onerror = () => {
      document.getElementById('loadingRing').style.display = 'none';
      document.getElementById('errorMsg').style.display = 'block';
    };
  }
}

// Search
document.getElementById('searchInput').addEventListener('input', applyFilter);

// Keyboard navigation
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown' && currentIndex < channels.length - 1) {
    playChannel(currentIndex + 1);
  } else if (e.key === 'ArrowUp' && currentIndex > 0) {
    playChannel(currentIndex - 1);
  }
});

loadM3U();
